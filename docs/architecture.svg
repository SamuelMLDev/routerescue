<path class="line" d="M313 231 V285"/><path class="line" d="M955 231 V285"/>
<rect class="box" x="67" y="286" width="472" height="128"/><text class="tag" x="87" y="315">AUTHORITATIVE CONTROL PATH</text><text class="title" x="87" y="346">Human coordinator + local HTTP</text><text class="hint" x="87" y="373">Confirm facts · exact approval · version checks</text><text class="hint" x="87" y="394">MCP tool client /mcp v2025-11-25</text>
<rect class="box" x="760" y="286" width="472" height="128"/><text class="tag" x="782" y="315">COUNTERFACTUAL PATH</text><text class="title" x="782" y="346">Read-only scenario fork</text><text class="hint" x="782" y="373">Bounded worker threads · no state mutation</text><text class="hint" x="782" y="394">Proof bound · optional road matrix · backup slots</text>
