<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="760" viewBox="0 0 1300 760" role="img" aria-label="RouteRescue v4 architecture, with intervention engine and optional trusted inputs">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#547d66"/></marker><style>text{font-family:Inter,Arial,sans-serif}.head{font-size:37px;font-weight:800;letter-spacing:-2px;fill:#173d2e}.sub{font-size:15px;fill:#6d8373}.title{font-size:20px;fill:#183d2c;font-weight:800}.hint{font-size:14px;fill:#5c7565}.tag{font-size:12px;letter-spacing:1.4px;font-weight:800;fill:#498264}.line{stroke:#547d66;stroke-width:2.7;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:8 7}.box{fill:#fff;stroke:#c9ddc9;stroke-width:1.6;rx:17}</style></defs>
<rect width="1300" height="760" fill="#f4f7f2"/>
<text x="68" y="71" class="head">RouteRescue / Resilience Engine</text><text x="70" y="103" class="sub">Version 4.0 · explicit operational authority · independent computational proof · offline self-hosted MCP</text>
